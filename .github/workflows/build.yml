name: Compilar Roteador para iPhone
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compilar para iPhone
        run: |
          set -euo pipefail
          xcodebuild -project VivoChip.xcodeproj -scheme VivoChip -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Testar abertura no simulador
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$UDID"
          xcodebuild -project VivoChip.xcodeproj -scheme VivoChip -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/simulator" ARCHS="$(uname -m)" CODE_SIGNING_ALLOWED=NO
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$RUNNER_TEMP/simulator/Build/Products/Release-iphonesimulator/VivoChip.app"
          xcrun simctl launch "$UDID" app.hotspotlock.guard.controller
          xcrun simctl terminate "$UDID" app.hotspotlock.guard.controller
          xcodebuild test -project VivoChip.xcodeproj -scheme VivoChip -configuration Debug -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath "$RUNNER_TEMP/uitests" CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO
          CONTAINER=$(xcrun simctl get_app_container "$UDID" app.hotspotlock.guard.controller data)
          python3 -c 'import base64,pathlib,sys; p=pathlib.Path(sys.argv[1])/"Library/Application Support/Roteador/pairing.dat"; assert p.read_bytes() == base64.b64encode(bytes([1])*32); print("Verified durable pairing after app restart")' "$CONTAINER"
      - name: Verificar e empacotar
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/build/Build/Products/Release-iphoneos/VivoChip.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' "$APP/Info.plist")" = Roteador
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")" = app.hotspotlock.guard.controller
          test -f "$APP/Assets.car"
          lipo "$APP/VivoChip" -verify_arch arm64
          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto "$APP" "$RUNNER_TEMP/package/Payload/VivoChip.app"
          cd "$RUNNER_TEMP/package"
          ditto -c -k --keepParent Payload Roteador-1.3.ipa
          unzip -t Roteador-1.3.ipa
          shasum -a 256 Roteador-1.3.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Roteador-1.3-ipa
          path: ${{ runner.temp }}/package/Roteador-1.3.ipa
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Roteador-ui-test-results
          path: ${{ runner.temp }}/uitests/Logs/Test
          if-no-files-found: ignore
          retention-days: 2
